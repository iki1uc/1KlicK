<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · Axiom‑Orbit · minimal</title>
<style>
  body { background:#0b0b0b; color:#e0e0e0; font-family:Consolas; padding:20px; }
  h1 { color:#6cf; font-size:18px; }
  .container { max-width:700px; margin:0 auto; }
  .flex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  #orbitCanvas { background:#000; border:1px solid #333; display:block; }
  #log { background:#111; padding:10px; height:100px; overflow:auto; font-size:12px; }
  .btn { padding:6px 14px; background:#222; color:#fff; border:1px solid #555; cursor:pointer; font-family:Consolas; }
  .btn:hover { border-color:#6cf; }
  .btn.active { border-color:#6cf; background:#2a3a4a; }
  .label { color:#8ab0c0; font-size:12px; }
  input[type="range"] { width:110px; accent-color:#6cf; }
</style>
</head>
<body>
<div class="container">

<h1>IKI1UC · Axiom‑Orbit <span style="color:#5a7a8a;font-weight:300;">minimal</span></h1>

<canvas id="orbitCanvas" width="660" height="220"></canvas>

<div class="flex">
  <button class="btn" id="btnPlay">⏸ Pause</button>
  <button class="btn" id="btnStep">▶ Schritt</button>
  <button class="btn" id="btnReset">⟲ Reset</button>
  <span class="label">Geschw.</span>
  <input type="range" id="speedSlider" min="1" max="10" value="3">
  <span class="label" id="speedLabel">3×</span>
</div>

<div class="flex">
  <button class="btn" id="btnModeIQQ">IQQ</button>
  <button class="btn" id="btnModeOCTA">OCTA</button>
  <button class="btn" id="btnModeA81">A81</button>
</div>

<div id="log">Bereit.</div>

</div>

<script>
"use strict";

const ORBIT = ["◉","↗","↘","3","9","↘","↗","◎","↗","↘","3","9","↘","↗",
  "◎","↗","↘","81","◆","↘","↗","△","↗","↘","27","▣","↘","↗","3","↺"];

const AXIOM_MAP = {
  '3':'IQQ','9':'IQQ',
  '◎':'OCTA','◉':'OCTA','◆':'OCTA','△':'OCTA','▣':'OCTA','↺':'OCTA',
  '81':'A81','27':'A81','243':'A81','729':'A81'
};

const STEP_BASE = 800, STEP_FACTOR = 60, STEP_MIN = 100;

const state = {
  index: 0, running: true, speed: 3, mode: 'IQQ',
  history: [], accumulator: 0, lastFrame: null
};

const canvas = document.getElementById('orbitCanvas');
const ctx = canvas.getContext('2d');

function drawOrbit() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  const hist = state.history.slice(-5);
  hist.forEach((idx, i) => {
    const alpha = 0.15 + (i / 4) * 0.3;
    const x = 60 + (w - 120) * (i / 4);
    const y = h - 24;
    ctx.fillStyle = `rgba(108,204,255,${alpha})`;
    ctx.font = '14px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(ORBIT[idx] || '?', x, y);
  });

  const symbol = ORBIT[state.index] || '?';
  ctx.fillStyle = '#6cf';
  ctx.font = '48px Consolas';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#6cf';
  ctx.shadowBlur = 16;
  ctx.fillText(symbol, w/2, h/2 - 14);
  ctx.shadowBlur = 0;

  const axiom = AXIOM_MAP[symbol] || '—';
  ctx.fillStyle = '#5a7a8a';
  ctx.font = '12px Consolas';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`#${state.index} · ${axiom} · ${state.mode}`, w/2, h/2 + 30);
}

function stepOrbit() {
  state.index = (state.index + 1) % ORBIT.length;
  state.history.push(state.index);
  if (state.history.length > 5) state.history.shift();
  log(`${ORBIT[state.index]} (${AXIOM_MAP[ORBIT[state.index]] || '—'})`);
}

function togglePlay() {
  state.running = !state.running;
  document.getElementById('btnPlay').textContent = state.running ? '⏸ Pause' : '▶ Start';
}

function resetOrbit() {
  state.index = 0; state.history = []; state.accumulator = 0;
  log('⟲ Reset');
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btnMode' + mode).classList.add('active');
}

function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = `[${t}] ${msg}`;
}

document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnStep').addEventListener('click', stepOrbit);
document.getElementById('btnReset').addEventListener('click', resetOrbit);
document.getElementById('btnModeIQQ').addEventListener('click', () => setMode('IQQ'));
document.getElementById('btnModeOCTA').addEventListener('click', () => setMode('OCTA'));
document.getElementById('btnModeA81').addEventListener('click', () => setMode('A81'));

const speedSlider = document.getElementById('speedSlider');
speedSlider.addEventListener('input', () => {
  state.speed = parseInt(speedSlider.value, 10);
  document.getElementById('speedLabel').textContent = state.speed + '×';
});

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') stepOrbit();
  if (e.key === 'r' || e.key === 'R') resetOrbit();
  if (e.key === '1') setMode('IQQ');
  if (e.key === '2') setMode('OCTA');
  if (e.key === '3') setMode('A81');
});

function loop(now) {
  if (state.lastFrame === null) state.lastFrame = now;
  const delta = now - state.lastFrame;
  state.lastFrame = now;
  if (state.running) {
    state.accumulator += delta;
    const stepTime = Math.max(STEP_MIN, STEP_BASE - state.speed * STEP_FACTOR);
    while (state.accumulator >= stepTime) { stepOrbit(); state.accumulator -= stepTime; }
  }
  drawOrbit();
  requestAnimationFrame(loop);
}

setMode('IQQ');
state.history.push(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
